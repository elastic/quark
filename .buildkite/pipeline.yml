# The distribution steps fetch their kernel as they run, with the
# exact kernel version documented in parenthesis. A version that is
# present means the step boots that kernel every time: typically
# the kernels come from archives that no longer change.
#
# A "current" version means whatever the mirror has today. Ubuntu steps
# boot the newest kernel of the release, which is the HWE one where it
# exists and not the kernel the release came out with.
steps:
  - label: "build amd64 in docker"
    key: make_docker
    command: "make docker NO_GO=y WITH_BTFHUB=y"
    artifact_paths:
      - "initramfs.gz"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2

  - label: "build amd64 in a centos7 container"
    key: make_centos7
    command: "make centos7 NO_GO=y WITH_BTFHUB=y"
    artifact_paths:
      - "quark-test"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2

  - label: "build arm64 cross-compiled in docker"
    key: make_docker_cross_arm64
    command: "make docker-cross-arm64 NO_GO=y WITH_BTFHUB=y"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2

  - label: "build amd64 in an alpine container (no syslib)"
    key: make_alpine_nosyslib
    command: "make alpine NO_GO=y WITH_BTFHUB=y"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2

  - label: "build amd64 in an alpine container (with syslib)"
    key: make_alpine_syslib
    command: "make alpine SYSLIB=y NO_GO=y WITH_BTFHUB=y"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2

  - label: "quark-test"
    key: test
    command: "./.buildkite/runtest.sh"
    depends_on:
      - make_centos7
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2
      enableNestedVirtualization: true

  - label: "build and run quark-test under valgrind amd64"
    key: valgrind_amd64
    command: "./.buildkite/runvalgrind.sh"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-highcpu-8
      enableNestedVirtualization: true

  - label: "test-go"
    key: test_go
    # we trigger a full rebuild to make sure dependencies for go are correct
    command: "./.buildkite/runtestgo.sh"
    agents:
      image: family/core-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2
      enableNestedVirtualization: true

